name: Odd Saint — Weekly Maintenance Sweep

# Runs every Monday at 03:00 UTC.
# Can also be triggered manually from the Actions tab.

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  maintenance-sweep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Repository layout sweep
        run: |
          echo "## Repository file inventory" >> "$GITHUB_STEP_SUMMARY"

          find . -type f \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './.next/*' \
            | sort >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency audit (report only)
        run: |
          echo "## Dependency Audit" >> "$GITHUB_STEP_SUMMARY"

          echo "### Outdated dependencies" >> "$GITHUB_STEP_SUMMARY"
          npm outdated || true

          echo "### Security audit" >> "$GITHUB_STEP_SUMMARY"
          npm audit --audit-level=high || true

      - name: Apply safe, non-breaking dependency updates
        run: |
          npx --yes npm-check-updates -u --target minor
          npm install

      - name: Run lint and build to verify the update is safe
        run: |
          npm run lint --if-present
          npm run build --if-present

      - name: Open a pull request with any changes
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: weekly dependency maintenance sweep'
          title: 'Weekly maintenance: dependency updates'
          body: |
            Automated weekly sweep results:

            - Ran `npm outdated`
            - Ran `npm audit`
            - Applied minor/patch dependency updates
            - Verified lint and build

            Please review before merging.
            This PR does not auto-merge.

          branch: chore/weekly-maintenance-sweep
          delete-branch: true
